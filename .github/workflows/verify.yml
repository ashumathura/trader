name: Verify build (temporary)
on:
  push:
    branches: [claude/gracious-mayer-9c2fdj]
    paths: [".github/workflows/verify.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests
      - run: python3 pipeline/build_data.py
        env: { AV_KEY: "${{ secrets.AV_KEY }}" }
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          print("META", json.load(open("docs/data/meta.json")))
          for x in json.load(open("docs/data/stocks.json"))["stocks"]:
              a = x.get("analysts")
              if not a: print("ANALYSTS none", x["ticker"]); continue
              c = a["consensus"]; r = a["rev90"]
              print("AN %-14s rating=%s n=%s mean=%s%s upside=%s low=%s high=%s | counts_last=%s hist=%d trend=%s | actions=%d first=%s | rev90 up=%d dn=%d raise=%d cut=%d | sent=%s est=%s" % (
                  x["ticker"], c["rating"], c["n"], c["symbol"], c["mean"], c["upside_pct"], c["low"], c["high"], a["counts"][-1] if a["counts"] else None, len(a["history"]), a["trend"] and round(a["trend"]["change_pts"]),
                  len(a["actions"]), a["actions"] and (a["actions"][0]["date"], a["actions"][0]["firm"], a["actions"][0]["action"], a["actions"][0]["pt_text"]), r["upgrades"], r["downgrades"], r["target_raises"], r["target_cuts"], a["sentiment"]["label"], bool(a["estimates"])))
              print("      macro:", (x.get("macro") or {}).get("text"))
          mk = json.load(open("docs/data/market.json"))
          for row in mk["rates"]["rows"]: print("RATE %-14s %.2f 1d=%s 1m=%s asof=%s src=%s | %s" % (row["id"], row["last"], row["chg_1d_bp"] and round(row["chg_1d_bp"]), row["chg_1m_bp"] and round(row["chg_1m_bp"]), row["asof"], row["source"], row["extreme"]))
          for sp in mk["rates"]["spreads"]: print("SPREAD", sp["label"], round(sp["bp"]))
          print("INFL", mk["rates"]["inflation"])
          v = mk["vol"]; print("VOL", {k: v[k] for k in v if k not in ("notes",)})
          for p in mk["drivers_box"]: print("DRV", p["label"], "|", p["text"])
          print("MACRO factors", [f["id"] for f in (mk["macro"] or {}).get("factors", [])]); print("MACRO summary", (mk["macro"] or {}).get("summary"))
          for p in mk["preamble"]: print("PRE", p["label"], "|", p["text"])
          q = mk["quotes"]; print("QUOTES ok", sum(1 for z in q if z.get("price")), "of", len(q), "missing:", [z["symbol"] for z in q if not z.get("price")])
          PY
