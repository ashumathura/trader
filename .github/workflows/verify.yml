name: Verify build (temporary)
on:
  push:
    branches: [claude/gracious-mayer-9c2fdj]
    paths: [".github/workflows/verify.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests
      - run: python3 pipeline/build_data.py
        env: { AV_KEY: "${{ secrets.AV_KEY }}" }
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          print("META", json.load(open("docs/data/meta.json")))
          for x in json.load(open("docs/data/stocks.json"))["stocks"]:
              if x["status"] != "ok": print("NO DATA", x["ticker"]); continue
              f = x.get("flow") or {}; o = f.get("options") or {}; off = f.get("offexchange") or {}; sh = f.get("short") or {}; uk = f.get("uk_short"); ins = f.get("insiders")
              c = x.get("context") or {}
              print("%-14s flow=%-4s vol=%.2fx obv=%s | opt=%s pc=%s iv=%s em=%s pain=%s unusual=%d | off=%s short_ratio=%s | si=%s dtc=%s | uk=%s | ins=%s | etf=%s peers=%d fx=%s | risk=%s" % (
                  x["ticker"], f.get("overall", {}).get("tone"), f["volume_flow"]["volume"]["ratio"] or 0, f["volume_flow"]["obv"],
                  o.get("label"), o.get("pc_volume") and round(o["pc_volume"], 2), o.get("iv") and round(o["iv"], 2), o.get("expected_move_pct") and round(o["expected_move_pct"], 1), o.get("max_pain"), len(o.get("unusual", [])),
                  off.get("share") and round(off["share"], 2), off.get("short_ratio") and round(off["short_ratio"], 2), sh.get("shares"), sh.get("days_to_cover") and round(sh["days_to_cover"], 1),
                  uk and (uk["holders"], round(uk["total_pct"], 2)), ins and (ins["buys"], ins["sells"]),
                  (c.get("etf") or {}).get("symbol"), len(c.get("peers") or []), (c.get("fx") or {}).get("symbol"), [r["level"][0] for r in x.get("risk", [])]))
              print("      gaps:", f.get("gaps"))
          mk = json.load(open("docs/data/market.json"))
          for p in mk["preamble"]: print("PRE", p["label"], "|", p["text"])
          print("UNIVERSE", json.dumps(mk["universe"])[:700])
          print("QUOTES ok", sum(1 for q in mk["quotes"] if q.get("price")), "of", len(mk["quotes"]))
          PY
