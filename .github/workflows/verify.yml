name: Verify build (temporary)
on:
  push:
    branches: [claude/gracious-mayer-9c2fdj]
    paths: [".github/workflows/verify.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s tests
      - run: python3 pipeline/build_data.py
        env: { AV_KEY: "${{ secrets.AV_KEY }}" }
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("docs/data/meta.json")); print("META", m)
          s = json.load(open("docs/data/stocks.json"))["stocks"]
          for x in s:
              if x["status"] != "ok": print("NO DATA", x["ticker"], x.get("note")); continue
              r = x.get("regime"); print("%-14s %-8s via=%-6s bars=%-4d last=%-10.4f chg=%+.2f%% bias=%-8s score=%s regime=%s news=%d ev=%s" % (
                  x["ticker"], x["source"], x.get("via"), x["bars"], x["price"]["last"], x["price"]["chg_pct"], x["bias"], x["confluence"]["score"],
                  r and r["current"], len(x["news"]["items"]), [e["date"] for e in x["events"][:2]]))
          mk = json.load(open("docs/data/market.json"))
          print("QUOTES", [(q["name"], round(q["price"], 2)) for q in mk["quotes"] if q.get("price")])
          print("HEADLINES", len(mk["headlines"]), "CB", len(mk["central_banks"]), "DRIVERS", [d["theme"] for d in mk["drivers"]])
          for l in mk["read"]: print("READ", l)
          print("CAL", [(e["date"], e["title"]) for e in json.load(open("docs/data/calendar.json"))["events"][:8]])
          PY
